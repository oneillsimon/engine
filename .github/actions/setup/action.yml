name: 'Setup and Configuration'
description: 'Installs dependencies and configures CMake'
inputs:
  headless:
    description: 'Toggle headless GL (ON/OFF)'
    required: false
    default: 'ON'
  install-base-dependencies:
    description: 'Whether to install dependencies required to build and run the engine'
    required: false
    default: 'true'
  install-mesa:
    description: 'Whether to install mesa with pkgconf'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.install-base-dependencies }}" == "true" ]; then
          brew bundle
        fi
        
        if [ "${{ inputs.install-mesa }}" == "true" ]; then
          brew bundle --file=Brewfile.dev
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        fi

    - name: Configure environment
      shell: bash
      run: |
        if [ "${{ inputs.install-base-dependencies }}" == "true" ]; then
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENGINE_USE_HEADLESS_GL=${{ inputs.headless }}
        fi