name: 'Setup and Configuration'
description: 'Installs dependencies and configures CMake'
inputs:
  headless:
    description: 'Toggle headless GL (ON/OFF)'
    required: false
    default: 'ON'
  install-mesa:
    description: 'Whether to install mesa with pkgconf'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.install-mesa }}" == "true" ]; then
          brew install cmake lua swig mesa pkgconf
        else
          brew install cmake lua swig
        fi

    - name: Configure environment
      shell: bash
      run: |
        if [ "${{ inputs.install-mesa }}" == "true" ]; then
          # MESA_PREFIX=$(brew --prefix mesa)
          # echo "DYLD_LIBRARY_PATH=$MESA_PREFIX/lib" >> $GITHUB_ENV
          # echo "LIBGL_ALWAYS_SOFTWARE=true" >> $GITHUB_ENV
          # echo "GALLIUM_DRIVER=llvmpipe" >> $GITHUB_ENV
        fi

        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENGINE_USE_HEADLESS_GL=${{ inputs.headless }}