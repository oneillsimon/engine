name: 'Static Analysis'
description: 'Runs static analysis tools'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew install \
            actionlint \
            clang-format \
            glslang \
            luacheck \
            shellcheck \
            swig
        pip install cmake-format cmakelint

    - name: actionlint
      shell: bash
      run: actionlint

    - name: clang-format
      shell: bash
      run: |
        git ls-files \
        'applications/*.cpp' 'applications/*.h' \
        'src/*.cpp' 'src/*.h' \
        'swig/*.cpp' 'swig/*.h' \
        'tests/*.cpp' 'tests/*.h' \
        'main.cpp' | xargs clang-format --dry-run --Werror

    - name: glslValidator
      shell: bash
      run: git ls-files '*.glsl' | xargs glslangValidator

    - name: luacheck
      shell: bash
      run: git ls-files '*.lua' | xargs luacheck

    - name: cmake-format
      shell: bash
      run: cmake-format --check

    - name: cmakelint
      shell: bash
      run: cmakelint

    - name: swig
      shell: bash
      run: swig -lua -c++ -Werror -o /tmp/swig_wrap.cxx swig/swig.i