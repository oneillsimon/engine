name: 'Static Analysis'
description: 'Runs static analysis tools'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew bundle --file=Brewfile.dev
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    - name: lint
      shell: bash
      run: scripts/lint.sh