name: macOS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  static-analysis:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          install-mesa: 'true'

      - name: Static Analysis
        uses: ./.github/actions/static-analysis

  build-native:
    needs: static-analysis
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          headless: 'OFF'
          install-mesa: 'false'

      - name: Build Project
        uses: ./.github/actions/build

      - name: Run Tests
        uses: ./.github/actions/test
        with:
          graphics: 'false'
          scripting: 'true'
          unit: 'true'

  build-headless:
    needs: static-analysis
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          headless: 'ON'
          install-mesa: 'true'

      - name: Build Project
        uses: ./.github/actions/build

      - name: Run Tests
        uses: ./.github/actions/test
        with:
          graphics: 'true'
          scripting: 'true'
          unit: 'true'
