name: macOS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    permissions:
      contents: read

    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        brew install cmake lua swig

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --label-regex '^headless$' --output-on-failure --no-tests=error
