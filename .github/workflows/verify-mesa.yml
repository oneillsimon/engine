name: Verify OSMesa Installation

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/verify-mesa.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/verify-mesa.yml'

jobs:
  verify-osmesa:
    name: Verify OSMesa
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies plus Mesa
      run: |
        brew update
        brew install cmake lua swig mesa pkgconf

    - name: Set up Mesa environment
      run: |
        MESA_PREFIX=$(brew --prefix mesa)
        echo "MESA_PREFIX=$MESA_PREFIX" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=$MESA_PREFIX/lib" >> $GITHUB_ENV
        echo "LIBGL_ALWAYS_SOFTWARE=true" >> $GITHUB_ENV
        echo "GALLIUM_DRIVER=llvmpipe" >> $GITHUB_ENV

    - name: Print Mesa Homebrew prefix
      run: |
        echo "Mesa Homebrew prefix: $MESA_PREFIX"

    - name: List Mesa libraries
      run: |
        echo "=== Mesa libraries ==="
        ls -la $MESA_PREFIX/lib/*.dylib $MESA_PREFIX/lib/*.so* 2>/dev/null || true
        echo ""
        echo "=== Mesa pkg-config files ==="
        ls -la $MESA_PREFIX/lib/pkgconfig/ 2>/dev/null || true

    - name: List Mesa headers
      run: |
        echo "=== Mesa headers ==="
        find $MESA_PREFIX/include -name "*.h" | sort || true

    - name: Search for OSMesa components
      run: |
        echo "=== OSMesa Search Results ==="
        
        echo "libOSMesa:"
        find $MESA_PREFIX -name "libOSMesa*" -type f 2>/dev/null || echo "  NOT FOUND"
        
        echo "osmesa.h:"
        find $MESA_PREFIX -name "osmesa.h" -type f 2>/dev/null || echo "  NOT FOUND"
        
        echo "osmesa pkg-config entry:"
        if [ -f "$MESA_PREFIX/lib/pkgconfig/osmesa.pc" ]; then
          echo "  FOUND: $MESA_PREFIX/lib/pkgconfig/osmesa.pc"
          cat $MESA_PREFIX/lib/pkgconfig/osmesa.pc
        else
          echo "  NOT FOUND"
        fi
        
        if pkg-config --exists osmesa 2>/dev/null; then
          echo "  pkg-config confirms: osmesa is available"
          echo "  pkg-config --cflags osmesa: $(pkg-config --cflags osmesa 2>/dev/null)"
          echo "  pkg-config --libs osmesa: $(pkg-config --libs osmesa 2>/dev/null)"
        else
          echo "  pkg-config does NOT find: osmesa"
        fi

    - name: Record EGL libraries
      run: |
        echo "=== EGL Libraries (separate from OSMesa) ==="
        find $MESA_PREFIX -name "*EGL*" -type f 2>/dev/null | sort || echo "  No EGL libraries found"
        
        if [ -f "$MESA_PREFIX/lib/pkgconfig/egl.pc" ]; then
          echo "  EGL pkg-config entry FOUND"
        fi

    - name: Configure CMake
      run: |
        cmake -S . -B build/mesa -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build/mesa

    - name: Run graphics tests
      run: ctest --test-dir build/mesa --label-regex '^graphics$' --output-on-failure